# Supabase CLI configuration.
#
# ---------------------------------------------------------------------------
# THIS PROJECT DEVELOPS AGAINST A HOSTED SUPABASE PROJECT, NOT A LOCAL STACK.
# ---------------------------------------------------------------------------
#
# Almost everything in this file describes `supabase start`, which runs the
# whole stack in Docker. We do not use it. Migrations are applied to the hosted
# project with `pnpm db:migrate`, which talks to DATABASE_URL directly and
# needs neither Docker nor the CLI.
#
# The file is kept for two reasons:
#
#   1. `supabase link --project-ref <ref>` expects it, and linking is what
#      enables `supabase db pull` / `db push` / `db diff` if you ever want the
#      CLI's own migration tooling as a cross-check.
#   2. The [auth] block below can be pushed to the hosted project with
#      `supabase config push`, so the auth settings this app assumes are
#      recorded in the repo rather than clicked into a dashboard.
#
# The port numbers only matter if someone later runs `supabase start` with
# Docker installed. They are harmless otherwise.

project_id = "cadence-billing"

[api]
enabled = true
port = 54321
# `app` is deliberately absent. The SECURITY DEFINER helpers that RLS policies
# call live there, and nothing in that schema should be reachable over REST.
#
# This is load-bearing for more than tidiness: app.limits_bypassed() must not
# be callable by an HTTP client, whatever key it holds.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match this to the hosted project's Postgres major version, which the
# dashboard shows under Settings -> Infrastructure. `supabase db diff` produces
# wrong output when it disagrees.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Local mail catcher. Not available against a hosted project: a hosted project
# sends real email through whatever SMTP provider it is configured with, or
# through Supabase's rate-limited default sender.
#
# This is the one real casualty of dropping the local stack. See the note on
# email in README.md — the seed works around it by creating users with
# email_confirm set, so no confirmation mail is ever needed for demo accounts.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

# ---------------------------------------------------------------------------
# The block below is the one worth pushing to the hosted project:
#   supabase link --project-ref <ref>
#   supabase config push
# ---------------------------------------------------------------------------

[auth]
enabled = true
# Must match NEXT_PUBLIC_APP_URL. Stripe redirects and auth callbacks both
# resolve against it, and a mismatch shows up as a silent redirect failure.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Kept ON for the hosted project, because it is the real default and turning it
# off on a hosted project leaves an open signup endpoint that mints confirmed
# accounts for any address. Demo users sidestep it via the admin API; the
# Playwright suite will do the same rather than reading a mailbox.
enable_confirmations = true
secure_password_change = false

[auth.sessions]
timebox = "24h"

[analytics]
enabled = false
